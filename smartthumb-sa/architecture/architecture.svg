<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#37474f"/></marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b2a41">SmartThumb SA - Serverless Architecture</text>

  <rect x="30" y="200" width="130" height="80" rx="10" fill="#eceff1" stroke="#37474f"/>
  <text x="95" y="235" text-anchor="middle" font-size="14" font-weight="bold">Seller / tester</text>
  <text x="95" y="256" text-anchor="middle" font-size="12">uploads JPG / PNG</text>

  <rect x="210" y="190" width="170" height="100" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="295" y="225" text-anchor="middle" font-size="14" font-weight="bold">S3 source bucket</text>
  <text x="295" y="246" text-anchor="middle" font-size="12">private, encrypted</text>
  <text x="295" y="264" text-anchor="middle" font-size="12">ObjectCreated event</text>

  <rect x="430" y="190" width="190" height="100" rx="10" fill="#fff3e0" stroke="#ef6c00"/>
  <text x="525" y="222" text-anchor="middle" font-size="14" font-weight="bold">AWS Lambda</text>
  <text x="525" y="242" text-anchor="middle" font-size="12">Python 3.12 + Pillow</text>
  <text x="525" y="260" text-anchor="middle" font-size="12">validate - resize - write</text>
  <text x="525" y="278" text-anchor="middle" font-size="11" fill="#555">IAM: least privilege</text>

  <rect x="690" y="190" width="180" height="100" rx="10" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="780" y="225" text-anchor="middle" font-size="14" font-weight="bold">S3 output bucket</text>
  <text x="780" y="246" text-anchor="middle" font-size="12">thumbnails/  labels/</text>
  <text x="780" y="264" text-anchor="middle" font-size="12">separate = no loops</text>

  <rect x="430" y="60" width="190" height="80" rx="10" fill="#f3e5f5" stroke="#7b1fa2" stroke-dasharray="6 4"/>
  <text x="525" y="92" text-anchor="middle" font-size="14" font-weight="bold">Amazon Rekognition</text>
  <text x="525" y="112" text-anchor="middle" font-size="12">optional: DetectLabels</text>

  <rect x="430" y="380" width="190" height="80" rx="10" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="525" y="412" text-anchor="middle" font-size="14" font-weight="bold">Amazon CloudWatch</text>
  <text x="525" y="432" text-anchor="middle" font-size="12">JSON logs, errors, duration</text>

  <line x1="160" y1="240" x2="208" y2="240" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="240" x2="428" y2="240" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="620" y1="240" x2="688" y2="240" stroke="#37474f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="525" y1="188" x2="525" y2="142" stroke="#7b1fa2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <line x1="525" y1="292" x2="525" y2="378" stroke="#1565c0" stroke-width="2" marker-end="url(#a)"/>

  <text x="450" y="500" text-anchor="middle" font-size="12" fill="#555">Invalid files are rejected and logged (no retries). Transient AWS errors are retried; output keys are deterministic (idempotent).</text>
</svg>
